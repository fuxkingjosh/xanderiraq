<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>XanderIraq</title>
<meta name="deploy-check" content="auto-1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky bar with page tabs → one view at a time (Home / Shop / Product / About / Contact); cart slides in from the right */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#161a24; --muted:#5c6577; --line:#dde1ea;
  --accent:#e0811b; --accent-ink:#ffffff; --soft:#fbe9d3; --ok:#1f8a5b; --bad:#c0392b;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141b; --surface:#191d27; --fg:#eef0f5; --muted:#9aa3b5; --line:#2a3040;
  --accent:#f29a3a; --accent-ink:#1a1206; --soft:#3a2a17; --ok:#4cc58c; --bad:#ff7a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#191d27; --fg:#eef0f5; --muted:#9aa3b5; --line:#2a3040;
  --accent:#f29a3a; --accent-ink:#1a1206; --soft:#3a2a17; --ok:#4cc58c; --bad:#ff7a6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;text-decoration:none}
.logo i{width:22px;height:22px;background:conic-gradient(var(--accent) 0 25%,var(--fg) 0 50%,var(--accent) 0 75%,var(--fg) 0);border-radius:3px;display:block}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs a{text-decoration:none;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs a:hover{color:var(--fg);background:var(--bg)}
nav.tabs a[aria-current="page"]{background:var(--fg);color:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:8px 16px;font-weight:600}
.cartbtn b{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:22px;padding:0 6px;font-size:13px;font-variant-numeric:tabular-nums}
main{min-height:60vh}
.view{padding-block:32px 56px;display:grid;gap:24px}
h1.big{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,52px);line-height:1.02;letter-spacing:-.02em;margin:0;max-width:16ch;text-wrap:balance}
h1.mid{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.08;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0}
.lead{margin:0;color:var(--muted);max-width:58ch;font-size:17px}
.perks{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.perks span::before{content:"■ ";color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 18px;font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cat{display:grid;gap:4px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.cat strong{font-family:var(--display);font-size:20px}
.cat span{color:var(--muted);font-size:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head a{font-weight:600;color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;min-width:0;width:220px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:4/3;max-width:100%;position:relative;display:block}
.tag{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--surface);color:var(--fg);padding:3px 8px;border-radius:6px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.body h3{font-family:var(--display);font-weight:800;font-size:19px;margin:0;line-height:1.15}
.body h3 a{text-decoration:none}
.body h3 a:hover{text-decoration:underline}
.desc{color:var(--muted);margin:0;font-size:14px}
.spec{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.price{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 14px;font-weight:600}
.add[data-in="1"]{background:var(--soft);color:var(--fg)}
.empty{grid-column:1/-1;color:var(--muted);padding:40px 0;text-align:center}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.pager button{min-width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 12px}
.pager button[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pager small{width:100%;text-align:center;color:var(--muted)}
/* product page */
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.pdp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.pdp{grid-template-columns:1fr}}
.pdp .thumb{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.pdp-info{display:grid;gap:14px;min-width:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.facts dt{color:var(--muted);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.facts dd{margin:0}
.flip{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.flip a{display:grid;gap:2px;text-decoration:none;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0;max-width:48%}
.flip a small{color:var(--muted);font-size:12px}
.flip a b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flip a.next{text-align:right;margin-left:auto}
/* about / steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.steps div{display:grid;gap:4px;align-content:start}
.steps strong{font-weight:600}
.steps p{margin:0;color:var(--muted);font-size:14px}
.prose{max-width:62ch;display:grid;gap:12px}
.prose p{margin:0}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details summary{font-weight:600;cursor:pointer}
details p{margin:8px 0 0;color:var(--muted)}
.faq{display:grid;gap:10px;max-width:720px}
/* forms */
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;max-width:620px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.field textarea{min-height:140px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px}
.msg{font-size:14px;color:var(--muted);margin:0}
.msg.ok{color:var(--ok)}
.msg.bad{color:var(--bad)}
.signup{background:var(--soft);border-radius:16px;padding:20px;display:grid;gap:10px}
.signup form{display:flex;gap:8px;flex-wrap:wrap}
.signup input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit}
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;font-size:13px;color:var(--muted)}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
/* cart */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:20}
aside.cart{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 18px;border-left:1px solid var(--line)}
.cart h2{font-size:22px}
.cart header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.lines{flex:1;overflow:auto;display:grid;align-content:start;gap:10px}
.line{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.line .sw{width:48px;height:48px;border-radius:8px}
.line b{display:block;font-weight:600}
.line small{color:var(--muted);font-family:var(--mono);font-size:11px}
.rm{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:20px;padding-block:12px;font-variant-numeric:tabular-nums}
form.co{display:grid;gap:8px}
form.co label{font-size:13px;font-weight:600}
form.co input{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit}
.pay{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px;font-weight:700;font-size:16px}
@media (prefers-reduced-motion:no-preference){aside.cart{animation:in .22s ease-out}@keyframes in{from{transform:translateX(30px);opacity:.6}}
  .view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}}}
</style>

<header class="bar"><div class="wrap">
  <div class="top">
    <a class="logo" href="#home"><i></i>XanderIraq</a>
    <button class="cartbtn" id="openCart" aria-label="Open cart">Cart <b id="count">0</b></button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Pages">
    <a href="#home" data-v="home">Home</a>
    <a href="#shop" data-v="shop">Shop</a>
    <a href="#schematics" data-v="schematics">Schematics</a>
    <a href="#photos" data-v="photos">Photos</a>
    <a href="#packs" data-v="packs">Packs</a>
    <a href="#about" data-v="about">About</a>
    <a href="#contact" data-v="contact">Contact</a>
  </nav>
</div></header>

<main class="wrap" id="app"></main>

<footer><div class="wrap">
  <span>© <span id="yr"></span> XanderIraq · Digital goods for Minecraft players</span>
  <nav><a href="#shop">Shop</a><a href="#about">FAQ</a><a href="#contact">Contact</a></nav>
</div></footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="cart" id="cart" hidden aria-label="Cart">
  <header><h2>Your cart</h2><button class="x" id="closeCart">Close</button></header>
  <div class="lines" id="lines"></div>
  <div class="total"><span>Total</span><span id="total">$0.00</span></div>
  <form class="co" id="co" novalidate>
    <label for="email">Email for download links</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
    <button class="pay" type="submit" id="payBtn">Check out</button>
    <p class="msg" id="msg"></p>
  </form>
</aside>

<script>
/* ============ SETTINGS: edit these ============ */
// Free key from web3forms.com (enter your email there; the key arrives in your inbox).
// Contact messages and newsletter signups get emailed to you.
const WEB3FORMS_KEY = "21ad7332-886a-40fb-9041-4ee5e11c9c19";
const PER_PAGE = 6; // products per shop page

// Your products. "link" = your Stripe / Gumroad / Payhip payment link.
const PRODUCTS=[
 {id:"spawn-castle",cat:"Schematics",name:"Obsidian Spawn Castle",desc:"Fortified keep with ender-chest vault and nether portal room.",spec:["87×64×91","212k blocks","1.20+"],price:12,c:["#2b2140","#6c4fb0","#e0811b"],link:""},
 {id:"stash-hall",cat:"Schematics",name:"Hidden Stash Hall",desc:"Underground storage hall, 432 double chests, item sorter built in.",spec:["48×12×60","38k blocks","1.20+"],price:8,c:["#1f2a24","#3f7a5a","#d6c27a"],link:""},
 {id:"mapart",cat:"Schematics",name:"Map Art Starter Pack",desc:"Six 128×128 map arts with block lists and staircase layouts.",spec:["6 maps","flat + stair","1.19+"],price:6,c:["#1d3047","#3b79c2","#f2d16b"],link:""},
 {id:"ruins-photo",cat:"Photos",name:"Overworld Ruins Set",desc:"24 cinematic shader screenshots of abandoned bases, 4K.",spec:["24 images","3840×2160","PNG"],price:5,c:["#3a2a1c","#b5703a","#f3c98b"],link:""},
 {id:"nether-photo",cat:"Photos",name:"Nether Highway Set",desc:"18 wide shots along the highways, good for wallpapers and thumbnails.",spec:["18 images","3840×2160","PNG"],price:4,c:["#3b1414","#c0392b","#f39c4a"],link:""},
 {id:"thumb-kit",cat:"Packs",name:"YouTube Thumbnail Kit",desc:"Layered backgrounds, block icons and fonts for build videos.",spec:["40 assets","PSD + PNG"],price:7,c:["#141c2e","#e0811b","#eef0f5"],link:""},
 {id:"tex-pack",cat:"Packs",name:"Muted Stone Texture Pack",desc:"16× pack that tones down stone, deepslate and cobble for cleaner builds.",spec:["16×","Java 1.21"],price:3,c:["#2c2f36","#7a8091","#c9ccd4"],link:""}
];
/* ============================================== */

const $=s=>document.querySelector(s);
const app=$("#app");
const CATS={schematics:"Schematics",photos:"Photos",packs:"Packs"};
const BLURB={Schematics:"Paste-ready builds in .schem and .litematic.",Photos:"4K shader screenshots for wallpapers and thumbnails.",Packs:"Texture packs and creator kits."};
let cart=[],page=1,query="";
try{cart=JSON.parse(localStorage.getItem("xi-cart")||"[]")}catch(e){cart=[]}
const save=()=>{try{localStorage.setItem("xi-cart",JSON.stringify(cart))}catch(e){}};
const money=n=>"$"+n.toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const art=c=>`background:linear-gradient(135deg,transparent 0 45%,${c[2]} 45% 55%,transparent 55%),repeating-linear-gradient(90deg,${c[0]} 0 24px,${c[1]} 24px 48px),repeating-linear-gradient(0deg,${c[0]} 0 24px,${c[1]} 24px 48px);background-blend-mode:normal,multiply`;
const slug=c=>c.toLowerCase();

function card(p){
  const inCart=cart.includes(p.id);
  return `<article class="card"><a class="thumb" href="#item-${p.id}" style="${art(p.c)}" aria-label="${esc(p.name)}"><span class="tag">${p.cat}</span></a>
    <div class="body"><h3><a href="#item-${p.id}">${esc(p.name)}</a></h3><p class="desc">${esc(p.desc)}</p>
    <div class="spec">${p.spec.map(s=>`<span>${esc(s)}</span>`).join("")}</div>
    <div class="row"><span class="price">${money(p.price)}</span>
    <button class="add" data-id="${p.id}" data-in="${inCart?1:0}">${inCart?"In cart":"Add to cart"}</button></div></div></article>`;
}
function signup(){
  return `<section class="signup"><h2>Get new drops by email</h2>
    <p class="msg">New builds and photo sets go out to the list first.</p>
    <form data-form="signup" novalidate><input class="hp" type="checkbox" name="botcheck" tabindex="-1" aria-hidden="true">
    <input id="su-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" aria-label="Your email">
    <button class="btn" type="submit">Sign up</button></form><p class="msg" data-out></p></section>`;
}

const views={
  home(){
    const counts=Object.values(CATS).map(c=>[c,PRODUCTS.filter(p=>p.cat===c).length]);
    return `<section class="view">
      <div style="display:grid;gap:12px">
        <h1 class="big">Builds, photos and packs you can download tonight.</h1>
        <p class="lead">Schematics ready to paste with Litematica or WorldEdit, high-res photo sets, and texture packs. Pay once, get the files by email.</p>
        <div class="perks"><span>Instant download</span><span>.schem + .litematic</span><span>Personal-use license</span></div>
        <div class="btns"><a class="btn" href="#shop">Browse the shop</a><a class="btn ghost" href="#contact">Request a custom build</a></div>
      </div>
      <div class="cats">${counts.map(([c,n])=>`<a class="cat" href="#${slug(c)}"><strong>${c} →</strong><span>${BLURB[c]} ${n} item${n===1?"":"s"}.</span></a>`).join("")}</div>
      <div class="sec-head"><h2>Newest</h2><a href="#shop">See all ${PRODUCTS.length} →</a></div>
      <div class="grid">${PRODUCTS.slice(0,3).map(card).join("")}</div>
      ${signup()}
      <p class="note">Products shown are examples. Swap in your own items and payment links before sharing the store.</p>
    </section>`;
  },
  list(cat){
    const all=PRODUCTS.filter(p=>(!cat||p.cat===cat)&&(!query||(p.name+p.desc).toLowerCase().includes(query)));
    const pages=Math.max(1,Math.ceil(all.length/PER_PAGE)); if(page>pages)page=pages;
    const shown=all.slice((page-1)*PER_PAGE,page*PER_PAGE);
    const nums=Array.from({length:pages},(_,i)=>i+1);
    return `<section class="view">
      <div style="display:grid;gap:8px"><h1 class="mid">${cat||"All products"}</h1><p class="lead">${cat?BLURB[cat]:"Everything in the store. Tap a product to see the full details."}</p></div>
      <div class="tools">
        <div class="chips" role="group" aria-label="Category">
          <a class="chip" href="#shop" aria-pressed="${!cat}" style="text-decoration:none">All</a>
          ${Object.values(CATS).map(c=>`<a class="chip" href="#${slug(c)}" aria-pressed="${cat===c}" style="text-decoration:none">${c}</a>`).join("")}
        </div>
        <input class="search" id="q" type="search" placeholder="Search products" aria-label="Search products" value="${esc(query)}">
      </div>
      <div class="grid" aria-live="polite">${shown.length?shown.map(card).join(""):`<p class="empty">No products match “${esc(query)}”. Try another word or category.</p>`}</div>
      ${pages>1?`<nav class="pager" aria-label="Pages">
        <button data-pg="${page-1}" ${page===1?"disabled":""}>← Prev</button>
        ${nums.map(n=>`<button data-pg="${n}" ${n===page?'aria-current="page"':""}>${n}</button>`).join("")}
        <button data-pg="${page+1}" ${page===pages?"disabled":""}>Next →</button>
        <small>Showing ${(page-1)*PER_PAGE+1}–${(page-1)*PER_PAGE+shown.length} of ${all.length}</small></nav>`:""}
    </section>`;
  },
  item(id){
    const i=PRODUCTS.findIndex(p=>p.id===id); if(i<0)return views.missing();
    const p=PRODUCTS[i],prev=PRODUCTS[(i-1+PRODUCTS.length)%PRODUCTS.length],next=PRODUCTS[(i+1)%PRODUCTS.length];
    const inCart=cart.includes(p.id);
    const labels=p.cat==="Schematics"?["Size","Blocks","Version"]:p.cat==="Photos"?["Images","Resolution","Format"]:["Contents","Format","Version"];
    return `<section class="view">
      <div class="crumbs"><a href="#shop">Shop</a>/<a href="#${slug(p.cat)}">${p.cat}</a>/<span>${esc(p.name)}</span></div>
      <div class="pdp">
        <div class="thumb" style="${art(p.c)}"><span class="tag">${p.cat}</span></div>
        <div class="pdp-info">
          <h1 class="mid">${esc(p.name)}</h1>
          <span class="price">${money(p.price)}</span>
          <p class="lead" style="font-size:16px">${esc(p.desc)}</p>
          <dl class="facts">${p.spec.map((s,k)=>`<dt>${labels[k]||"Detail"}</dt><dd>${esc(s)}</dd>`).join("")}<dt>License</dt><dd>Personal use</dd><dt>Delivery</dt><dd>Download link by email</dd></dl>
          <div class="btns"><button class="btn add" data-id="${p.id}" data-in="${inCart?1:0}">${inCart?"In cart":"Add to cart"}</button><button class="btn ghost" id="buyNow" data-id="${p.id}">Buy now</button></div>
        </div>
      </div>
      <nav class="flip" aria-label="More products">
        <a href="#item-${prev.id}"><small>← Previous</small><b>${esc(prev.name)}</b></a>
        <a class="next" href="#item-${next.id}"><small>Next →</small><b>${esc(next.name)}</b></a>
      </nav>
    </section>`;
  },
  about(){
    return `<section class="view">
      <div class="prose"><h1 class="mid">About XanderIraq</h1>
        <p class="lead">XanderIraq sells builds, screenshots and creator packs made in-game. Every schematic is tested in a fresh world before it goes up.</p></div>
      <h2>How buying works</h2>
      <div class="steps">
        <div><strong>1. Add to cart</strong><p>Pick the builds or photo sets you want. Prices are in USD.</p></div>
        <div><strong>2. Pay securely</strong><p>Checkout runs through the payment provider, so card details never touch this site.</p></div>
        <div><strong>3. Get your files</strong><p>A download link arrives at your email. Schematics include both .schem and .litematic.</p></div>
      </div>
      <h2>Questions</h2>
      <div class="faq">
        <details><summary>How do I paste a schematic?</summary><p>Put the .litematic file in your Litematica schematics folder, or the .schem file in WorldEdit's schematics folder, then load and paste it in-game.</p></details>
        <details><summary>Which Minecraft versions work?</summary><p>Each product lists its minimum version. Most builds work on Java 1.20 and newer.</p></details>
        <details><summary>I didn't get my download.</summary><p>Check your spam folder first. If it isn't there, send a message from the Contact page with your order email.</p></details>
        <details><summary>Can I get a custom build?</summary><p>Yes. Use the Contact page, pick "Custom build", and describe what you want.</p></details>
      </div>
    </section>`;
  },
  contact(){
    return `<section class="view">
      <div class="prose"><h1 class="mid">Contact</h1><p class="lead">Questions about an order, a custom build, or anything else. Messages go straight to the owner's inbox.</p></div>
      <form class="formcard" data-form="contact" novalidate>
        <input class="hp" type="checkbox" name="botcheck" tabindex="-1" aria-hidden="true">
        <div class="two">
          <div class="field"><label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name"></div>
          <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email"></div>
        </div>
        <div class="field"><label for="c-topic">Topic</label><select id="c-topic" name="topic"><option>Order help</option><option>Custom build</option><option>Question</option><option>Other</option></select></div>
        <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" name="message"></textarea></div>
        <button class="btn" type="submit">Send message</button>
        <p class="msg" data-out></p>
      </form>
    </section>`;
  },
  missing(){return `<section class="view"><h1 class="mid">Page not found</h1><p class="lead">That page doesn't exist. <a href="#shop">Go to the shop</a>.</p></section>`}
};

let lastView="";
function route(){
  const h=(location.hash||"#home").slice(1);
  let html,tab=h;
  if(h==="home"||h==="")html=views.home(),tab="home";
  else if(h==="shop")html=views.list(null);
  else if(CATS[h])html=views.list(CATS[h]);
  else if(h.startsWith("item-")){const p=PRODUCTS.find(x=>x.id===h.slice(5));html=views.item(h.slice(5));tab=p?slug(p.cat):"shop"}
  else if(h==="about")html=views.about();
  else if(h==="contact")html=views.contact();
  else html=views.missing(),tab="";
  if(h!==lastView){if(!h.startsWith("item-")&&!(lastView.startsWith("item-")))page=1;window.scrollTo(0,0)}
  lastView=h;
  app.innerHTML=html;
  document.querySelectorAll("#tabs a").forEach(a=>{if(a.dataset.v===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const cur=document.querySelector('#tabs a[aria-current="page"]');if(cur)cur.scrollIntoView({block:"nearest",inline:"nearest"});
  const q=$("#q");if(q){q.oninput=()=>{query=q.value.trim().toLowerCase();page=1;const pos=q.selectionStart;route();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
  renderCart();
}
function renderCart(){
  $("#count").textContent=cart.length;
  const items=cart.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean);
  $("#lines").innerHTML=items.length?items.map(p=>`<div class="line"><div class="sw" style="${art(p.c)}"></div>
     <div><b>${esc(p.name)}</b><small>${p.cat} · ${esc(p.spec[0])}</small></div>
     <div style="text-align:right"><div>${money(p.price)}</div><button class="rm" data-rm="${p.id}">Remove</button></div></div>`).join("")
    :`<p class="msg">Your cart is empty. Add a build or photo set to get started.</p>`;
  $("#total").textContent=money(items.reduce((s,p)=>s+p.price,0));
  $("#payBtn").disabled=!items.length;
}

app.addEventListener("click",e=>{
  const add=e.target.closest(".add[data-id]");
  if(add){const id=add.dataset.id;cart=cart.includes(id)?cart.filter(x=>x!==id):[...cart,id];save();route();return}
  const buy=e.target.closest("#buyNow");
  if(buy){if(!cart.includes(buy.dataset.id)){cart.push(buy.dataset.id);save();route()}open(true);return}
  const pg=e.target.closest("[data-pg]");
  if(pg&&!pg.disabled){page=+pg.dataset.pg;route();window.scrollTo(0,0)}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")open(false);
  const h=location.hash.slice(1);
  if(h.startsWith("item-")&&!e.target.closest("input,textarea,select")&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){
    const i=PRODUCTS.findIndex(p=>p.id===h.slice(5));if(i<0)return;
    const j=(i+(e.key==="ArrowRight"?1:-1)+PRODUCTS.length)%PRODUCTS.length;location.hash="item-"+PRODUCTS[j].id;
  }
});

// Forms → Web3Forms → your inbox
app.addEventListener("submit",async e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const out=f.parentElement.querySelector("[data-out]")||f.querySelector("[data-out]");
  const say=(t,c)=>{out.className="msg "+(c||"");out.textContent=t};
  const d=Object.fromEntries(new FormData(f));
  if(d.botcheck)return;
  if(!/^\S+@\S+\.\S+$/.test(d.email||""))return say("Enter a valid email address.","bad");
  if(f.dataset.form==="contact"&&!(d.message||"").trim())return say("Write a message before sending.","bad");
  if(!WEB3FORMS_KEY)return say("The form isn't connected yet. Add your Web3Forms key to turn it on.","bad");
  const body=f.dataset.form==="contact"
    ?{access_key:WEB3FORMS_KEY,subject:`XanderIraq: ${d.topic} from ${d.name||d.email}`,from_name:"XanderIraq website",name:d.name,email:d.email,topic:d.topic,message:d.message}
    :{access_key:WEB3FORMS_KEY,subject:"XanderIraq: new email signup",from_name:"XanderIraq website",email:d.email,message:"Signed up for new drops."};
  const btn=f.querySelector("button[type=submit]");btn.disabled=true;say("Sending…");
  try{
    const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.success){f.reset();say(f.dataset.form==="contact"?"Message sent. You'll get a reply by email.":"You're on the list.","ok")}
    else say("That didn't go through: "+(j.message||"unknown error")+". Try again in a minute.","bad");
  }catch(err){say("Couldn't reach the mail service. Check your connection and try again.","bad")}
  btn.disabled=false;
});

$("#lines").onclick=e=>{const b=e.target.closest("[data-rm]");if(!b)return;cart=cart.filter(x=>x!==b.dataset.rm);save();route()};
const open=v=>{$("#cart").hidden=!v;$("#scrim").hidden=!v;$("#msg").textContent="";$("#msg").className="msg"};
$("#openCart").onclick=()=>open(true);$("#closeCart").onclick=()=>open(false);$("#scrim").onclick=()=>open(false);
$("#co").onsubmit=e=>{e.preventDefault();const m=$("#msg");const email=$("#email").value.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){m.className="msg bad";m.textContent="Enter a valid email so we can send your download links.";return}
  const items=cart.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean);const linked=items.filter(p=>p.link);
  if(!linked.length){m.className="msg bad";m.textContent="Payments aren't connected yet. Add a payment link to each product to take real orders.";return}
  m.className="msg ok";m.innerHTML="Continue to payment: "+linked.map(p=>`<a href="${p.link}" target="_blank" rel="noopener">${esc(p.name)}</a>`).join(", ");
};
$("#yr").textContent=new Date().getFullYear();
window.addEventListener("hashchange",route);
route();
</script>
